name: aide

x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  hermes-tunnel:
    <<: *runtime
    build: deploy/tunnel
    volumes:
      - ./deploy/private/ssh:/keys:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8642"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    <<: *runtime
    build: .
    env_file:
      - path: ./deploy/private/backend.env
        format: raw
    environment:
      FASTAPI_ENV: production
      HERMES_BASE_URL: http://hermes-tunnel:8642
    depends_on:
      hermes-tunnel:
        condition: service_healthy
    # Only a local HTTPS proxy should expose this to phones/the internet.
    ports: ["127.0.0.1:${AIDE_API_PORT:-18000}:8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
